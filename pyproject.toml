[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ae-uploader"
version = "0.1.0"
description = "CLI tool for uploading CFD data to Invenio-RDM with metadata validation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AE Research Team", email = "irufan.ahmed@gmail.com"}
]
keywords = ["invenio", "rdm", "cfd", "data-upload", "metadata"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "click>=8.0.0",
    "requests>=2.28.0",
    "jsonschema>=4.17.0",
    "pyyaml>=6.0",
    "marshmallow>=3.19.0",
    "numpy>=1.26.0",
    "platformdirs>=4.0.0",
    "keyring>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=0.990",
]

[project.scripts]
ae-upload = "ae_uploader.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/ae-uploader"
Issues = "https://github.com/yourusername/ae-uploader/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ae_uploader = ["schemas/*.json", "web/*.html"]

[tool.setuptools.exclude-package-data]
ae_uploader = ["web/README.md"]
